name: Deploy ToolWala to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Create Deploy Verification Tokens
        run: |
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          SHORT_HASH=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "{\"version\": \"0.1.0\", \"commit\": \"$SHORT_HASH\", \"timestamp\": \"$TIMESTAMP\"}" > deploy-version.json
          echo "{\"version\": \"0.1.0\", \"commit\": \"$SHORT_HASH\", \"timestamp\": \"$TIMESTAMP\"}" > public/deploy-version.json
          echo "deployed at $TIMESTAMP" > deploy-test.txt
          echo "deployed at $TIMESTAMP" > public/deploy-test.txt

      - name: Create Zip Archive
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          # Compress necessary files, excluding node_modules, tests, and caches
          zip -r deploy.zip .next public prisma src supabase package.json package-lock.json server.js next.config.js tsconfig.json deploy-version.json deploy-test.txt check_permissions.php -x "**/node_modules/**" "**/.git/**" "**/.github/**"

      - name: Generate Unzip Script
        run: |
          TOKEN=$(openssl rand -hex 16)
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV
          cat << 'EOF' > unzip.php
          <?php
          $token = $_GET['token'] ?? '';
          $expected_token = 'EXPECTED_TOKEN';
          if (empty($token) || $token !== $expected_token) {
              header('HTTP/1.0 403 Forbidden');
              echo 'Forbidden';
              exit;
          }
          $zipFile = 'deploy.zip';
          if (!file_exists($zipFile)) {
              echo 'Error: deploy.zip not found';
              exit;
          }
          $zip = new ZipArchive;
          $res = $zip->open($zipFile);
          if ($res === TRUE) {
              $zip->extractTo(__DIR__);
              $zip->close();
              echo 'Success';
              unlink($zipFile);
              unlink(__FILE__);
          } else {
              echo 'Error: Failed to open zip file, code: ' . $res;
          }
          ?>
          EOF
          sed -i "s/EXPECTED_TOKEN/$TOKEN/g" unzip.php

      - name: Prepare Upload Folder
        run: |
          mkdir deploy-temp
          mv deploy.zip deploy-temp/
          mv unzip.php deploy-temp/

      - name: Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./deploy-temp/
          server-dir: ./

      - name: Trigger Unzip on Server
        run: |
          RESPONSE=$(curl -s "https://toolwala.co/unzip.php?token=${{ env.TOKEN }}")
          echo "Server Response: $RESPONSE"
          if [ "$RESPONSE" != "Success" ]; then
            echo "Failed to extract archive on server: $RESPONSE"
            exit 1
          fi
